<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shanghai (single player)</title>
<style>
  :root{--gold:#d8b45a;--gold2:#f3d98b;--felt:#17703f;--felt2:#0c4a28;--wal:#5a3218;--cw:58px;--ch:84px}
  *{box-sizing:border-box}
  body{margin:0;padding:10px 8px 24px;min-height:100vh;color:#f3ead2;font-family:Georgia,'Times New Roman',serif;
       background:radial-gradient(ellipse at top,#22170f 0%,#0b0806 65%) fixed}
  h1{margin:4px 0 0;text-align:center;font-size:30px;letter-spacing:5px;color:var(--gold);text-shadow:0 2px 6px #000}
  #app{max-width:1000px;margin:0 auto}
  .sub{text-align:center;color:#d9cfb8;font-size:15px;margin:2px 0 4px}
  .rule{height:1px;width:60%;margin:6px auto 10px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .status{text-align:center;font-size:14px;margin-bottom:6px;min-height:18px}
  .status button{min-height:36px;padding:3px 12px;margin:0 3px;font-size:13px}
  .turn{color:#ffe27a;font-weight:bold}
  /* Table */
  .table{position:relative;border-radius:200px/140px;padding:20px 18px;
     background:radial-gradient(ellipse at center,#1f8a4c 0%,var(--felt) 50%,var(--felt2) 100%);
     border:14px solid var(--wal);box-shadow:inset 0 0 50px #000a,0 0 0 2px var(--gold),0 0 0 16px #2c1709,0 14px 40px #000;
     display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
     grid-template-areas:"top top top" "left mid right" "mine mine mine";gap:10px;align-items:start}
  .seat{text-align:center;border-radius:14px;padding:6px;border:2px solid transparent;transition:border-color .2s,box-shadow .2s}
  .seat.current{border-color:var(--gold2);box-shadow:0 0 14px rgba(243,217,139,.7)}
  .seat.danger{border-color:#ff3b3b;box-shadow:0 0 14px #ff3b3b}
  .s-top{grid-area:top}.s-left{grid-area:left}.s-right{grid-area:right}.mid{grid-area:mid}.mine{grid-area:mine}
  .avatar{width:42px;height:42px;border-radius:50%;margin:0 auto 2px;border:2px solid var(--gold);
     background:radial-gradient(circle at 50% 38%,#6c8f78 0 22%,transparent 23%),radial-gradient(circle at 50% 100%,#6c8f78 0 40%,transparent 41%),#25362c}
  .pname{font-weight:bold;color:#fff;font-size:16px}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.35);color:#f3d98b;margin-left:4px}
  .tag.left{background:var(--gold);color:#2a1a10;font-weight:bold}
  .pinfo{font-size:12px;color:#d9cfb8}
  .opp-hand{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:4px 0}
  /* Cards */
  .card{position:relative;display:inline-block;flex:none;width:var(--cw);height:var(--ch);border-radius:7px;background:linear-gradient(#fff,#f1ede2);
     color:#141414;border:1px solid #9a9a9a;user-select:none;cursor:pointer;vertical-align:top;font-family:Georgia,serif;
     box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .12s}
  .card.red{color:#c0161c}
  .card .ix{position:absolute;left:4px;top:3px;line-height:.95;font-weight:700;font-size:calc(var(--cw)*.27);text-align:center}
  .card .ix.br{left:auto;top:auto;right:4px;bottom:3px;transform:rotate(180deg)}
  .card .ix i{display:block;font-style:normal;font-size:.85em}
  .card .pip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.55)}
  .card.wild{background:linear-gradient(#fff8d2,#f0d46a)}
  .card.wild .pip{font-size:calc(var(--cw)*.5)}
  .card.mini-card{--cw:26px;--ch:37px;cursor:default;border-radius:4px}
  .card.mini-card .ix{font-size:10px;left:2px;top:1px}.card.mini-card .ix.br{display:none}
  .card.mini-card .pip{font-size:14px;align-items:flex-end;justify-content:flex-end;padding:0 2px 1px 0}
  .card.back.mini-card{border-width:1px;box-shadow:0 2px 3px #0008}
  .card.back{background:repeating-linear-gradient(45deg,#8a161b 0 5px,#5c0e11 5px 10px);border:4px solid #fff;box-shadow:2px 3px 0 #ddd,4px 6px 0 #bbb,0 8px 14px #000a}
  .card.cur{outline:2px dashed #fff;outline-offset:2px}
  .card.penalty{border:2px solid #e33;box-shadow:0 0 8px #f33}
  .card.penalty::after{content:'+1';position:absolute;top:-14px;right:0;font-size:11px;color:#ff6b6b;font-weight:bold}
  /* Centre: deck, middle, pot */
  .mid{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-top:8px}
  .mid .lbl{font-size:12px;color:#e8dcb8;margin-bottom:3px;text-align:center}
  .mid .card{--cw:66px;--ch:94px}
  .tray{text-align:center}
  .tray .lbl{color:var(--gold2);font-weight:bold;letter-spacing:2px}
  .pot{display:block;width:96px;min-height:70px;padding:6px;border-radius:10px;cursor:pointer;line-height:0;
     background:#1b0f07;border:5px solid #6b3d1d;box-shadow:inset 0 3px 12px #000,0 0 0 2px var(--gold),0 6px 12px #000a}
  .pot.over{background:#3a2a0a;border-color:#ffd700}
  .pot small{line-height:1.3;color:#bba}
  .mini{display:inline-block;width:14px;height:14px;border-radius:50%;margin:1px;background:radial-gradient(#f44 40%,#900 42%,#f44 60%);border:2px dashed #fff}
  /* Felt where melds rest flat */
  .table-felt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;border-radius:12px;min-height:30px;
     background:rgba(0,0,0,.16);box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
  .table-felt small{opacity:.7;align-self:center}
  .meld{display:inline-flex;flex-wrap:wrap;max-width:100%;min-width:0;gap:2px;padding:3px;border-radius:8px;cursor:pointer;border:1px dashed rgba(243,217,139,.24)}
  .meld:hover{border-color:rgba(243,217,139,.6);background:rgba(243,217,139,.1)}
  .table-felt .card{--cw:40px;--ch:57px;box-shadow:0 1px 1px rgba(0,0,0,.55);transform:none}
  .mine .table-felt .card{--cw:50px;--ch:71px}
  .table-felt .card.drop{animation:drop .6s ease-out}
  @keyframes drop{0%{transform:translateY(-60px) scale(1.15);box-shadow:0 14px 16px rgba(0,0,0,.6);opacity:.6}
     80%{transform:translateY(2px) scale(1)}100%{transform:none;box-shadow:0 1px 1px rgba(0,0,0,.55)}}
  .mine .lbl{text-align:center;font-size:13px;color:#e8dcb8;margin-bottom:3px}
  /* Controls & hand */
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
  button{font-family:inherit;font-size:15px;min-height:44px;padding:8px 12px;border-radius:10px;cursor:pointer;color:#f3ead2;
     background:linear-gradient(#262321,#161412);border:1px solid #6d5a2e;box-shadow:0 2px 4px #000a}
  button.primary{background:linear-gradient(#f0d07a,#c79c3e);color:#2a1a10;border-color:#8a6a24;font-weight:bold}
  button:hover:not(:disabled){filter:brightness(1.15)}
  button:disabled,button.dim{opacity:.5}
  #toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,40px);max-width:92vw;z-index:100;opacity:0;pointer-events:none;
    background:#1b140c;color:#f3ead2;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font:15px system-ui,sans-serif;box-shadow:0 8px 24px #000;transition:.25s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .yourturn{text-align:center;color:var(--gold2);margin:6px 0}
  .me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 4px;border-radius:14px;border:2px solid transparent}
  .me.current{border-color:var(--gold2);box-shadow:0 0 14px rgba(243,217,139,.6)}
  .me.danger{border-color:#ff3b3b;box-shadow:0 0 14px #ff3b3b}
  .chips{display:flex;align-items:center;padding-left:6px}
  .chip{display:inline-block;width:30px;height:30px;border-radius:50%;margin-right:-12px;cursor:grab;touch-action:none;
     background:radial-gradient(#f44 40%,#900 42%,#f44 60%);border:3px dashed #fff;box-shadow:0 2px 3px #0008}
  .chip.sel{transform:translateY(-10px);outline:3px solid #ff0}
  .score{margin-left:auto;text-align:center;border:1px solid #6d5a2e;border-radius:10px;padding:4px 18px;background:#141210}
  .score b{display:block;font-size:22px;color:var(--gold2)}
  .sidebtns{display:flex;gap:6px;flex-wrap:wrap}
  #hand{border-radius:14px;padding:16px 4px 10px;margin-top:4px}
  #hand.over{background:rgba(232,199,102,.2)}
  .handcards{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 6px;padding-top:6px}
  .handcards .card{--cw:64px;--ch:92px;transform:translateY(-6px);box-shadow:0 12px 16px rgba(0,0,0,.6),0 3px 4px rgba(0,0,0,.4)}
  .handcards .card.sel{transform:translateY(-16px);border:2px solid var(--gold2);box-shadow:0 0 12px var(--gold2),0 16px 18px rgba(0,0,0,.6)}
  .panel{background:rgba(0,0,0,.25);border:1px solid rgba(232,199,102,.35);border-radius:12px;padding:8px;margin:8px 0}
  .ready{text-align:center}.ready .meld .card{--cw:40px;--ch:57px}
  table{border-collapse:collapse;margin:auto}td,th{padding:3px 10px;text-align:left;border-bottom:1px solid rgba(232,199,102,.3)}
  details.hist{text-align:center;margin-top:10px}
  details.hist summary{display:inline-block;list-style:none;cursor:pointer;min-height:44px;line-height:28px;padding:8px 22px;border-radius:10px;border:1px solid #6d5a2e;background:#161412}
  details.hist summary::-webkit-details-marker{display:none}
  #log{text-align:left;max-height:180px;overflow:auto;font-size:13px;font-family:system-ui,sans-serif}
  small{opacity:.85}
  .warn{background:#b3121b;color:#fff;font-weight:bold;text-align:center;padding:6px;border-radius:10px;margin:0 0 8px;animation:pulse 1s infinite}
  .badge1{background:#e01b24;color:#fff;font-size:11px;padding:1px 6px;border-radius:10px;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .round-result{text-align:center;border:2px solid var(--gold);border-radius:12px;background:#14291d;padding:8px;margin:4px 0 8px;font-size:14px}
  .round-result strong{display:block;color:var(--gold2);font-size:30px;letter-spacing:2px;line-height:1.1}
  .round-result.lost{background:#341c17}
  .round-result .overall{font-size:12px;margin-top:3px;color:#e8dcb8}
  @media(max-width:640px){.round-result{padding:5px;margin:3px 0 5px;font-size:12px}.round-result strong{font-size:25px}.round-result .overall{font-size:11px}}
  .dealer{background:#e8c766;color:#241a09;font-weight:bold}
  select{font:inherit;padding:10px;background:#241a09;color:#f3ead2;border:1px solid var(--gold);border-radius:8px}
  .table.many-seats{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:none;gap:5px}
  .many-seats .extra-seat{grid-area:auto}
  .many-seats .mid,.many-seats .mine{grid-area:auto;grid-column:1/-1}
  .many-seats .avatar{display:none}
  .many-seats .table-felt .card{--cw:24px;--ch:34px}
  /* ---- Phone: whole table + hand fits ~375x667 and 390x844 for a normal 11-card hand ---- */
  @media (max-width:640px){
    body{padding:4px 4px calc(4px + env(safe-area-inset-bottom));min-height:100svh}
    h1{font-size:17px;letter-spacing:3px;margin:0;display:inline}
    .sub{display:inline;font-size:12px;margin-left:6px}
    body>h1{display:block;text-align:center;line-height:20px}
    #app{text-align:center}
    .sub{display:block;margin:0;line-height:16px}
    .rule{display:none}
    .status{font-size:12px;margin:0 0 3px;min-height:15px}
    .warn{padding:3px;font-size:12px;margin-bottom:3px}
    .table{border-radius:46px/40px;border-width:6px;padding:6px 5px;gap:4px;
      box-shadow:inset 0 0 30px #000a,0 0 0 1px var(--gold),0 0 0 7px #2c1709,0 6px 18px #000;
      grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"top top top" "left mid right" "mine mine mine"}
    .seat{padding:2px;border-radius:10px}
    .seat .avatar{display:none}
    .pname{font-size:12px}.tag{font-size:9px;padding:0 4px;margin-left:2px}
    .pinfo{font-size:10px;line-height:12px}
    .opp-hand{gap:1px;margin:2px 0}
    .card.mini-card{--cw:17px;--ch:24px;border-radius:3px}
    .card.mini-card .ix{font-size:8px;left:1px}.card.mini-card .pip{font-size:9px;padding:0 1px 0 0}
    .table-felt{padding:2px;gap:2px;min-height:18px;border-radius:7px}
    .table-felt small{font-size:9px}
    .meld{padding:1px;gap:1px}
    .table-felt .card{--cw:20px;--ch:28px;border-radius:3px}.mine .table-felt .card{--cw:26px;--ch:37px}
    .table-felt .card .ix{font-size:9px;left:1px;top:1px}.table-felt .card .ix.br,.table-felt .card .pip{display:none}
    .mid{gap:6px;padding-top:2px;align-items:center}
    .mid .lbl{font-size:10px;margin-bottom:1px}
    .mid .card{--cw:40px;--ch:57px}
    .card.back{border-width:3px}
    .pot{width:58px;min-height:34px;padding:3px;border-width:3px}.mini{width:9px;height:9px;border-width:1px}
    .mine .lbl{font-size:10px;margin-bottom:1px}
    .actions{gap:4px;margin:5px 0 3px}
    button{font-size:13px;min-height:40px;padding:4px 3px;border-radius:9px}
    .me{gap:5px;padding:2px;flex-wrap:nowrap;text-align:left}
    .me .avatar{display:none}
    .me .pinfo{font-size:10px}
    .chip{width:22px;height:22px;margin-right:-15px;border-width:2px}.chips{padding-right:15px}
    .sidebtns{gap:3px;flex-wrap:nowrap}.sidebtns button{min-height:38px;padding:3px 8px}
    .score{padding:1px 8px;font-size:11px}.score b{font-size:16px}
    #hand{padding:9px 0 4px;margin-top:2px}
    .handcards{gap:4px 3px;padding-top:3px}
    .handcards .card{--cw:44px;--ch:63px;transform:translateY(-3px)}
    .handcards .card.sel{transform:translateY(-9px)}
    .handcards .card .ix{left:3px;top:2px}
    details.hist{margin-top:2px}details.hist summary{min-height:36px;line-height:20px;padding:7px 18px;font-size:13px}
    details.hist small{display:none}
  }
.run-end{font-size:9px;padding:3px;min-width:44px;min-height:44px;align-self:center;touch-action:none}.drop-target{outline:3px solid #ffe08a!important;background:rgba(255,224,138,.15)!important}.dragging-card{pointer-events:none!important;z-index:999!important}
.chip,.mini{background:radial-gradient(circle,var(--chip-color,#ef4444) 38%,#0009 42%,var(--chip-color,#ef4444) 63%)}
  .chip-palette{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;margin-bottom:7px}
  .color-choice{width:28px;height:28px;min-width:28px;padding:0;border:2px solid #fff9;border-radius:50%;background:var(--chip-color);color:white;font-weight:bold;text-shadow:0 1px 3px #000}
  .color-choice[aria-pressed="true"]{outline:2px solid #ffe08a;outline-offset:2px}
  .owner-chip{display:inline-block;width:10px;height:10px;border:1px dashed white;border-radius:50%;background:var(--chip-color);vertical-align:middle}
.card.joker{background:repeating-linear-gradient(135deg,#fff8dc 0px,#fff8dc 5px,#ead8a7 5px,#ead8a7 7px);color:#6b2580;border-color:#b58021}
  .joker-corner{position:absolute;top:3%;left:4%;font:bold max(5px,calc(var(--cw)*.14))/1 Arial,sans-serif;letter-spacing:-.2px}
  .joker-corner.bottom{top:auto;left:auto;right:4%;bottom:3%;transform:rotate(180deg)}
  .joker-emblem{position:absolute;top:19%;left:0;right:0;text-align:center;font:bold calc(var(--cw)*.38)/1 Georgia,serif;color:#752e8a}
  .joker-word{position:absolute;top:62%;left:0;right:0;text-align:center;font:bold max(5px,calc(var(--cw)*.15))/1 Arial,sans-serif;color:#54216a}
.card.new-card{outline:3px solid #3ef3ff;outline-offset:1px;box-shadow:0 0 12px #3ef3ff99,0 8px 15px #0009}
  .new-badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#3ef3ff;color:#002b31;font:bold 8px/1 Arial,sans-serif;padding:2px 3px;border-radius:3px;z-index:3;pointer-events:none}
.card.insert-before{border-left:4px solid #8dff83!important;box-shadow:-5px 0 0 #8dff83!important}.card.insert-after{border-right:4px solid #8dff83!important;box-shadow:5px 0 0 #8dff83!important}.hand-tools{text-align:center;font-size:11px}.hand-tools button{font-size:11px;padding:5px;margin:2px}
.buy-time{font-size:12px;white-space:nowrap}.buy-time select{font:inherit;padding:4px;border-radius:5px}.buy-time+small{font-size:10px}
.score{min-width:76px;border:2px solid #f3d98b;background:#101d17;padding:4px 7px;box-shadow:0 0 8px #e9bc5544}.score span{font:700 10px/1.2 Arial,sans-serif;color:#fff;letter-spacing:.3px}.score b{font:800 28px/1.1 Arial,sans-serif;color:#fff2b0}
.bot-score{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;max-width:100%;padding:3px 5px;margin:3px 0;border:1px solid #ffe7a0;border-radius:6px;background:#092b20;color:#fff;font:700 12px/1.2 Arial,sans-serif;box-sizing:border-box}.bot-score b{font-size:17px;color:#fff2b0}
/* Keep timer-only updates out of layout: reserve action space in every phase. */
.status-text{min-height:20px}.status-actions{min-height:36px}.countdown{display:inline-block;min-width:2ch;font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:640px){.status-text{min-height:30px}.status-actions{min-height:36px}}
#app{overflow-anchor:none}
.named-round-winner{font:bold 23px/1.2 Arial,sans-serif;color:#fff5ba;margin:5px 0;overflow-wrap:anywhere}.winner-badge{display:inline-block;margin:2px 4px;padding:3px 5px;border-radius:5px;background:#f3d98b;color:#13261d;font:bold 11px/1.1 Arial,sans-serif}.round-winner-seat{border:2px solid #fff0a2!important;box-shadow:0 0 0 2px #c99a3d!important;transition:none!important}.round-winners ol{list-style:none;margin:5px auto;padding:0;max-width:300px;display:grid;grid-template-columns:1fr 1fr;gap:5px;text-align:left;font:12px/1.3 Arial,sans-serif}
@media(max-width:640px){.named-round-winner{font-size:21px}}
.wild-rule{box-sizing:border-box;min-height:36px;margin:3px auto 5px;padding:3px 8px;max-width:620px;border:1px solid #8f8458;border-radius:7px;background:#102b21;color:#fff4cf;text-align:center;font:600 12px/16px Arial,sans-serif}
.placement-choice{text-align:center;font:13px/1.4 Arial,sans-serif}.placement-choice button{font-size:12px;margin:3px;padding:7px}.discard-owner{font:700 11px/14px Arial,sans-serif;color:#fff4cf;min-height:28px;max-width:95px;text-align:center;overflow-wrap:anywhere}

.card.editable-wild{border:2px solid #cf97ff;box-shadow:0 0 5px #d6a1ff88}.card.selected-wild{outline:3px solid #f8a6ff!important}.wild-edit-badge{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#dfadff;color:#271335;border-radius:3px;padding:1px 2px;font:bold 7px/1 Arial,sans-serif;pointer-events:none}.wild-position-panel{text-align:center;font:12px/1.5 Arial,sans-serif}.wild-position-panel button{font-size:12px;padding:8px;margin:3px}

/* Directional card awareness: fixed paint-only overlays never affect board geometry. */
.card-motion-flight,.card-motion-arrival{position:fixed;z-index:1800;pointer-events:none!important;box-sizing:border-box;contain:layout paint;}
.card-motion-flight{transform-origin:top left;will-change:transform,opacity;filter:drop-shadow(0 3px 4px #18374835);}
.card-motion-flight>.card{margin:0!important;width:100%!important;height:100%!important;box-sizing:border-box;pointer-events:none!important;}

@keyframes skip-reminder{0%,100%{box-shadow:0 0 0 1px #f5d88855,0 0 6px #f5d88844}50%{box-shadow:0 0 0 3px #f5d88899,0 0 17px #ffe5a5aa}}

@media(prefers-reduced-motion:reduce){button.skip-nudge:not(:disabled){animation:none!important;box-shadow:0 0 0 2px #f5d88899,0 0 10px #f5d88866!important}}


/* Read-only human-turn indicators: steady green, never an extra flashing cue. */
.player-turn-area{position:relative;border-radius:18px}
.player-turn-area.is-human-turn{outline:3px solid #56e99c;outline-offset:4px;box-shadow:0 0 0 6px #137c4944,0 0 20px #50e89c77}
.deck-zone{border-radius:9px}

@media(prefers-reduced-motion:reduce){.player-turn-area.is-human-turn,.deck-zone.turn-deck{animation:none!important;transition:none!important}}


/* Sixty-second discard cue: popup occupies a reserved lane, never the cards/buttons. */
.turn-actions .discard-anchor{position:relative;align-self:stretch;border-radius:10px;min-width:0}
.turn-actions .discard-anchor>button[data-action="discard"]{width:100%;height:100%}
.discard-anchor.reminder-due{outline:2px solid #ff8196;outline-offset:2px;animation:discard-reminder-pulse 2.6s ease-in-out infinite}
@keyframes discard-reminder-pulse{0%,100%{box-shadow:0 0 0 2px #ff4f6b66,0 0 7px #ff547855}50%{box-shadow:0 0 0 4px #ff718da0,0 0 19px #ff5b82aa}}
.player-controls .discard-anchor.reminder-due>button[data-action="discard"]:not(:disabled){background:#a73950!important;color:#fff!important;border-color:#ffc2cd!important}
.discard-reminder-space{height:64px;pointer-events:none}
.player-controls .discard-anchor .discard-reminder-bubble{position:absolute;right:-4px;bottom:calc(100% + 10px);width:240px;max-width:70vw;min-height:0;padding:8px 27px 8px 10px;background:#fff2ee!important;color:#7b2438!important;border:2px solid #e98294!important;border-radius:11px;box-shadow:0 4px 12px #25051866;font:12px/1.35 Arial,sans-serif;text-align:left;z-index:120;cursor:pointer}
.discard-reminder-bubble::after{content:'';position:absolute;bottom:-8px;right:24px;width:12px;height:12px;background:#fff2ee;border-right:2px solid #e98294;border-bottom:2px solid #e98294;transform:rotate(45deg);pointer-events:none}
.reminder-close{position:absolute;right:7px;top:3px;font:18px Arial,sans-serif;color:#8e3546}
@media(max-width:900px){.player-controls .discard-anchor .discard-reminder-bubble{font-size:11px;padding:7px 25px 7px 9px}}
@media(prefers-reduced-motion:reduce){.discard-anchor.reminder-due{animation:none!important;box-shadow:0 0 0 2px #ff819699,0 0 12px #ff698177!important}}

   violet 3, gold/orange 4; hues follow the default avatar coats. */

[data-player="1"]{--neon:#ff3df2}
[data-player="2"]{--neon:#9dff3a}
[data-player="3"]{--neon:#a66bff}
[data-player="4"]{--neon:#ff9a1f}

 --bubble-fill:rgba(16,22,40,.65);
 border:2px solid var(--neon,#29f3ff);background:var(--bubble-fill);

 box-shadow:0 0 6px var(--neon,#29f3ff),0 0 14px color-mix(in srgb,var(--neon,#29f3ff) 45%,transparent),inset 0 0 5px color-mix(in srgb,var(--neon,#29f3ff) 18%,transparent);

<body>
<h1>Shanghai</h1>
<div id="app"></div>
<script>
/* =====================================================================
   RULES / CONFIG — tweak these to change the game.
   ===================================================================== */
// Comic lines: edit these lists freely. BUY and WILD_SWAP are Carter's supplied phrases.
const PHRASES = {
  // Starter hit reactions — edit these freely; cosmetic only.
  okay: ['Go for it', 'All yours'],
  claim: ['No, mine!', 'Hands off!'],
  luckyDraw: ["Oh wow!", "Lucky!", "Just what I needed!"],
  luckyWinning: ["That's the one!", "Winner card!"],
  stolen: ['Noooo!', 'Hey, that was mine!', 'Robbed!'],
  hit: ["Hey!", "You got me!", "Brrr!", "Food fight?"],
  // Item-specific hit reactions: snowballs only get cold lines, food only gets food lines.
  hitSnowball: ["Brrr, it's cold!", "Brrr!", "Snow down my collar!", "I'm freezing!", "Ice cold, really?", "My nose is frozen!"],
  hitFood: ["Food fight?", "Hey, that's lunch!", "Not the food!", "Mmm... wait, gross!", "Now I'm hungry!", "Save me a bite!", "This is gonna stain my shirt"],
  BUY: ["I buy that!", "I want that!", "Mine!", "Oowee!", "Oh Yeah!"],
  WILD_SWAP: ["Thaaank you!", "I'll take that :)", "Pleasure doing business"],
  // Placeholder starter lines below; replace or extend them as desired.
  GO_DOWN: ["Boom!", "Read 'em and weep", "Down I go!"],
  LAYOFF: ["And one more...", "Don't mind if I do"],
  GO_OUT: ["Shanghai!", "I'm out!", "Better luck next round"],
  SKIP_BUY: ["Nah, I'm good", "Pass"]
};
PHRASES.buy=PHRASES.BUY; // Alias used by buy challenges; edit BUY above.
const CONFIG = {
  NUM_DECKS: 7,          // 7 standard decks shuffled together
  JOKERS_PER_DECK: 2,    // jokers included as wilds
  TWOS_WILD: true,       // twos are wild too
  HAND_SIZE: 11,         // cards dealt to each player
  START_CHIPS: 7,        // chips to buy from the middle
  DEAL_CARD_MS: 110,     // sequential one-card flight time
  DEALER_CARD_MS: 400,   // dealer-draw reveal pace
  DEALER_REVEAL_MS: 1400,
  NUM_PLAYERS: 4,        // you + 3 computer players (2..11 works)
  EXACT_PACKET_CHIPS: 1, // dealer estimates exactly players * 11 cards
  PLUS_ONE_PACKET_CHIPS: 2, // one extra for middle; no reward if that extra card is wild
  EXTRA_MIN: 3,          // after the required meld you may also lay sets/straights of 3
  MIN_NATURALS: 1,       // a meld needs at least this many non-wild cards
  STRAIGHT_LEN: 7,       // length of the straight in round 7 (same suit)
  ALLOW_PLAY_OWN: true,  // once down, you may add cards to your OWN melds (to dump points)
  WILDS_ANYWHERE: true,  // once down, a wild may go on ANY down player's meld (natural cards: left player only)
  WILD_SWAP: true,       // optional explicit replacement may take the wild; ordinary additions never do
  DRAWS_PER_TURN: 1,     // one draw per turn: drawing from the deck OR buying from the middle uses it
  BUY_PENALTY_CARDS: 1,  // buying from the middle also forces you to take this many penalty cards from the deck
  CHALLENGE_BUY_WINDOW_MS: 1200, // no-claim blocking window AFTER the discard lands
  CHALLENGE_RESPONSE_MS: 6000,   // response window, bounded by modal maximum
  CHALLENGE_MAX_MS: 16000,        // entire challenge modal, including Buy/Pass
  BUY_WINDOW_MS: 3000,   // classic default; selectable 2, 3, 5, 10, 15 or 20 seconds
  BOT_ACTION_MS: 600,    // short visible draw/meld/play stages, independent of buying pause
  BOT_DELAY: 700         // ms between computer moves
};
// Round requirements. sets: sizes of required sets. runs: lengths of required straights.
const ROUNDS = [
  {name:'2 sets of 3',  sets:[3,3]},
  {name:'1 set of 4',   sets:[4]},
  {name:'2 sets of 4',  sets:[4,4]},
  {name:'1 set of 5',   sets:[5]},
  {name:'2 sets of 5',  sets:[5,5]},
  {name:'1 set of 6',   sets:[6]},
  {name:'1 straight of '+CONFIG.STRAIGHT_LEN+'', runs:[CONFIG.STRAIGHT_LEN]},
];
// Scoring: aces 15, K/Q/J/10 = 10, twos and jokers 20, everything else face value.
function points(c){ if(c.r===0||c.r===2) return 20; if(c.r===1) return 15; if(c.r>=10) return 10; return c.r; }
function isWild(c){ return c.r===0 || (CONFIG.TWOS_WILD && c.r===2); }

/* ===================== Cards ===================== */
const SUITS=['S','H','D','C'], SYM={S:'♠',H:'♥',D:'♦',C:'♣',J:''};
const RN={0:'🃏',1:'A',11:'J',12:'Q',13:'K'};
let uid=0;
function makeDeck(){
  const d=[];
  for(let k=0;k<CONFIG.NUM_DECKS;k++){
    for(const s of SUITS) for(let r=1;r<=13;r++) d.push({id:uid++,r,s});
    for(let j=0;j<CONFIG.JOKERS_PER_DECK;j++) d.push({id:uid++,r:0,s:'J'});
  }
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
function label(c){ return c.r===0?'Joker':(RN[c.r]||c.r)+SYM[c.s]; }
function cardName(c){if(c.r===0)return 'Joker (wild)';const names={1:'Ace',11:'Jack',12:'Queen',13:'King'},suits={S:'spades',H:'hearts',D:'diamonds',C:'clubs'};return `${names[c.r]||c.r} of ${suits[c.s]}${isWild(c)?' (wild)':''}`;}
function vlabel(v){ return v===14?'A':(RN[v]||v); }
function cardHTML(c,cls='',attrs=''){
  if(c.r===0)return `<span class="card joker wild ${cls}" data-card-id="${c.id}" ${attrs} aria-label="Joker (wild)" ${attrs.includes('title=')?'':'title="Joker (wild)"'}><span class="joker-corner">JOKER</span><span class="joker-emblem" aria-hidden="true">★</span><span class="joker-word" aria-hidden="true">JOKER</span><span class="joker-corner bottom" aria-hidden="true">WILD</span>${cls.includes('new-card')?'<span class="new-badge">NEW</span>':''}${cls.includes('editable-wild')?'<span class="wild-edit-badge">MOVE</span>':''}</span>`;
  const red=(c.s==='H'||c.s==='D'||c.r===0)?' red':'';
  const rk=c.r===0?'★':(RN[c.r]||c.r), sy=c.r===0?'J':SYM[c.s];
  const pip=c.r===0?'🃏':(c.r>=11?`<b style="font-size:.8em">${RN[c.r]}</b>`:SYM[c.s]);
  const ix=`${rk}<i>${sy}</i>`;
  return `<span class="card${red}${isWild(c)?' wild':''} ${cls}" data-card-id="${c.id}" ${attrs} aria-label="${cardName(c)}" ${attrs.includes('title=')?'':`title="${cardName(c)}"`}><span class="ix">${ix}</span><span class="pip">${pip}</span><span class="ix br">${ix}</span>${cls.includes('new-card')?'<span class="new-badge">NEW</span>':''}${cls.includes('editable-wild')?'<span class="wild-edit-badge">MOVE</span>':''}</span>`;
}

/* ===================== Melds ===================== */
// A meld = {type:'set'|'run', rank|suit, cards:[{c:card, v:value it stands for}]}
function buildSet(cards,minLen){
  if(cards.length<minLen) return null;
  const nat=cards.filter(c=>!isWild(c));
  if(nat.length<Math.max(1,CONFIG.MIN_NATURALS)) return null;
  const r=nat[0].r; if(nat.some(c=>c.r!==r)) return null;
  return {type:'set',rank:r,cards:cards.map(c=>({c,v:r}))};
}
// Straight: all naturals same suit, consecutive; ace can be low (A-2-3...) or high (...Q-K-A); wilds fill gaps/ends.
// Round 7 needs at least CONFIG.STRAIGHT_LEN (7) cards.
function buildRun(cards,minLen){
  if(cards.length<minLen) return null;
  const nat=cards.filter(c=>!isWild(c)), wild=cards.filter(isWild);
  if(nat.length<Math.max(1,CONFIG.MIN_NATURALS)) return null;
  const suit=nat[0].s; if(nat.some(c=>c.s!==suit)) return null;
  for(const hiAce of [false,true]){
    const val=c=>(c.r===1&&hiAce)?14:c.r;
    const v=nat.map(val).sort((a,b)=>a-b);
    if(new Set(v).size!==v.length) continue;
    let lo=v[0],hi=v[v.length-1]; const gaps=hi-lo+1-v.length;
    if(gaps>wild.length) continue;
    let extra=wild.length-gaps;
    while(extra>0&&hi<14){hi++;extra--;} while(extra>0&&lo>1){lo--;extra--;}
    if(extra>0) continue;
    const w=[...wild], slots=[];
    for(let x=lo;x<=hi;x++){ const c=nat.find(n=>val(n)===x); slots.push({c:c||w.pop(),v:x}); }
    return {type:'run',suit,cards:slots};
  }
  return null;
}
function buildFor(cards,rq,minLen=CONFIG.EXTRA_MIN){ return rq.runs?(buildRun(cards,minLen)||buildSet(cards,minLen)):buildAny(cards,minLen); } // straight rounds: read all-wild-ish piles as straights
function buildAny(cards,minLen){ return buildSet(cards,minLen)||buildRun(cards,minLen); }
// Do these melds satisfy the round's required minimum?
function meetsReq(melds,req){
  const used=new Set();
  const need=[...(req.sets||[]).map(k=>['set',k]),...(req.runs||[]).map(k=>['run',k])].sort((a,b)=>b[1]-a[1]);
  for(const [t,k] of need){
    const i=melds.findIndex((m,j)=>!used.has(j)&&m.type===t&&m.cards.length>=k);
    if(i<0) return false; used.add(i);
  }
  return true;
}
// Try to add one card to a laid meld. Mutates only on success. Returns {ok, taken(wild)}.
function addToMeld(m,card,canSwap=false,end=null,swapId=null){ // canSwap=false: you can't take back a wild from your own melds
  if(m.type==='set'){
    if(isWild(card)){ m.cards.push({c:card,v:m.rank}); return {ok:true}; }
    if(card.r!==m.rank) return {ok:false};
    const i=m.cards.findIndex(s=>isWild(s.c)&&(swapId===null||s.c.id===swapId));
    if(i>=0&&CONFIG.WILD_SWAP&&canSwap){ const t=m.cards[i].c; m.cards[i]={c:card,v:m.rank}; return {ok:true,taken:t}; }
    m.cards.push({c:card,v:m.rank}); return {ok:true};
  }
  const lo=m.cards[0].v, hi=m.cards[m.cards.length-1].v;
  if(isWild(card)){
    if(end==='low'){if(lo<=1)return {ok:false};m.cards.unshift({c:card,v:lo-1});return {ok:true};}
    if(end==='high'){if(hi>=14)return {ok:false};m.cards.push({c:card,v:hi+1});return {ok:true};}
    if(hi<14){ m.cards.push({c:card,v:hi+1}); return {ok:true}; }
    if(lo>1){ m.cards.unshift({c:card,v:lo-1}); return {ok:true}; }
    return {ok:false};
  }
  if(card.s!==m.suit) return {ok:false};
  const vals=card.r===1?[1,14]:[card.r];
  if(end){const v=end==='low'?lo-1:hi+1;if(v<1||v>14||!vals.includes(v))return {ok:false};if(end==='low')m.cards.unshift({c:card,v});else m.cards.push({c:card,v});return {ok:true};}
  for(const v of vals){
    const i=m.cards.findIndex(s=>s.v===v&&isWild(s.c)&&(swapId===null||s.c.id===swapId));
    if(i>=0&&CONFIG.WILD_SWAP&&canSwap){ const t=m.cards[i].c; m.cards[i]={c:card,v}; return {ok:true,taken:t}; }
  }
  for(const v of vals){
    if(v===hi+1){ m.cards.push({c:card,v}); return {ok:true}; }
    if(v===lo-1){ m.cards.unshift({c:card,v}); return {ok:true}; }
  }
  return {ok:false};
}

// Exhaustive search for the round's required melds inside `pool`. Returns array of card arrays or null.
// Sets: one rank, >=1 natural, wilds fill. Runs: one suit, consecutive (ace low or high), wilds fill gaps/ends.
function solveReq(pool,rq,acceptRest=null){
  const need=[...(rq.runs||[]).map(k=>['run',k]),...(rq.sets||[]).map(k=>['set',k])];
  const rec=(i,avail)=>{
    if(i===need.length) return !acceptRest||acceptRest(avail)?[]:null;
    const [t,k]=need[i], wilds=avail.filter(isWild), nat=avail.filter(c=>!isWild(c));
    const tryG=g=>{ const rest=avail.filter(c=>!g.includes(c)); const r=rec(i+1,rest); return r?[g,...r]:null; };
    if(t==='set'){
      const by=groupBy(nat,c=>c.r);
      for(const grp of Object.values(by).sort((a,b)=>b.length-a.length))
        for(let nn=Math.min(grp.length,k);nn>=Math.max(1,CONFIG.MIN_NATURALS);nn--){
          if(k-nn>wilds.length) break;
          const r=tryG([...grp.slice(0,nn),...wilds.slice(0,k-nn)]); if(r) return r;
        }
    } else {
      for(const s of SUITS) for(let st=1;st+k-1<=14;st++){
        const g=[]; for(let v=st;v<st+k;v++){ const c=nat.find(x=>x.s===s&&(x.r===v||(x.r===1&&v===14))); if(c) g.push(c); }
        if(g.length<Math.max(1,CONFIG.MIN_NATURALS)||k-g.length>wilds.length) continue;
        const m=[...g,...wilds.slice(0,k-g.length)]; if(!buildRun(m,k)) continue;
        const r=tryG(m); if(r) return r;
      }
    }
    return null;
  };
  return rec(0,[...pool]);
}

/* ===================== Buying pause preference ===================== */
function normalizeBuySeconds(value){
  if(value===null||value===undefined||String(value).trim()==='')return 3;
  const v=Number(value),choices=[2,3,5,10,15,20];return Number.isFinite(v)?choices.reduce((best,x)=>Math.abs(x-v)<Math.abs(best-v)?x:best,3):3;
}
try{let saved=localStorage.getItem('shanghai-buy-seconds');if(localStorage.getItem('shanghai-buy-time-migration')!=='v39'){if(saved==='15'&&localStorage.getItem('shanghai-buy-explicit')!=='yes'){saved='3';localStorage.setItem('shanghai-buy-seconds','3');}localStorage.setItem('shanghai-buy-time-migration','v39');}CONFIG.BUY_WINDOW_MS=normalizeBuySeconds(saved)*1000;}catch(_){}
function setBuyTime(value){
  const seconds=normalizeBuySeconds(value);CONFIG.BUY_WINDOW_MS=seconds*1000;
  try{localStorage.setItem('shanghai-buy-seconds',String(seconds));localStorage.setItem('shanghai-buy-explicit','yes');localStorage.setItem('shanghai-buy-time-migration','v39');}catch(_){}

// Play onto the left player's meld (or own, if allowed).

//  - your own melds: any card (ALLOW_PLAY_OWN)

// Taking a wild back by playing its natural card only works on the LEFT player's melds,

 tabletopSaveWallet();tabletopPaintTableMoney();tabletopUpdateMoneySetup();tabletopRenderShop();

 const draw=render;render=function(...args){const r=draw.apply(this,args);tabletopSlamPaint();return r;};document.addEventListener('visibilitychange',()=>{if(document.hidden)tabletopSlamFinish(true);});}

/* v49 presentation only: readable receipts and nonmodal loot-earned celebration. */
const V49_NOTICE_TIMING={buyMS:3000,lootMS:3000};
let v49BuyCurrent=null,v49BuyQueue=[],v49BuyTimer=null,v49LootFX=null,v49LootPulseUntil=0;
const v49Escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function v49BotReceiptRemaining(actor){if(v49BuyCurrent?.state===G&&v49BuyCurrent.round===G.round&&v49BuyCurrent.actor===actor)return Math.max(0,v49BuyCurrent.until-Date.now());if(v49BuyQueue.some(e=>e.state===G&&e.round===G.round&&e.actor===actor))return Math.max(100,(v49BuyCurrent?.until||Date.now())-Date.now());return 0;}
function v49ClearBuyReceipts(){clearTimeout(v49BuyTimer);v49BuyTimer=null;v49BuyCurrent=null;v49BuyQueue=[];document.getElementById('buy-result-toast')?.remove();}
function v49QueueBuyReceipt(actor,result){
 const c=tabletopChallenge,claims=c?.state===G&&c.id===result.card.id?c.order.filter(i=>i===actor||c.responses[i]==='claim'):[],name=actor===0&&G.players[0].human?'You':G.players[actor].name;
 const entry={state:G,round:G.round,actor,name,card:{...result.card},penalty:result.penalty.length,priority:claims.length>1?`${claims.map(i=>i===0?'You':G.players[i].name).join(', ')} wanted it · ${name} wins turn-order priority.`:''};
 v49BuyQueue.push(entry);if(!v49BuyCurrent){if(actor===0)v49BuyTimer=setTimeout(v49ShowNextBuyReceipt,0);else v49ShowNextBuyReceipt();}
}
function v49ShowNextBuyReceipt(){
 clearTimeout(v49BuyTimer);v49BuyTimer=null;v49BuyQueue=v49BuyQueue.filter(e=>e.state===G&&e.round===G.round);if(tabletopRevealActive&&v49BuyQueue[0]?.actor===0){v49BuyTimer=setTimeout(v49ShowNextBuyReceipt,100);return;}const e=v49BuyQueue.shift();if(!e){v49BuyCurrent=null;return;}
 v49BuyCurrent=e;const root=document.createElement('aside');root.id='buy-result-toast';root.dataset.player=e.actor;root._state=e.state;root._round=e.round;root.dataset.receiptCardId=e.card.id;root.dataset.shownAt=Date.now();root.setAttribute('role','status');root.setAttribute('aria-live','polite');
 root.innerHTML=`<span class="buy-receipt-card" aria-hidden="true">${cardHTML(e.card).replace(/ data-card-id="[^"]*"/g,'')}</span><span class="buy-receipt-copy"><b>${v49Escape(e.name)} ${e.actor===0?'are':'is'} buying the ${v49Escape(label(e.card))}</b><small>(+${e.penalty} penalty card${e.penalty===1?'':'s'}, −1 coin)</small>${e.priority?`<strong class="buy-priority">${v49Escape(e.priority)}</strong>`:''}<span class="buy-receipt-hold" aria-hidden="true"></span></span>`;
 document.getElementById('buy-result-toast')?.remove();document.body.appendChild(root);e.el=root;e.shownAt=Date.now();e.until=e.shownAt+V49_NOTICE_TIMING.buyMS;
 const finish=()=>{if(v49BuyCurrent!==e)return;if(Date.now()<e.until){v49BuyTimer=setTimeout(finish,e.until-Date.now()+2);return;}root.remove();v49BuyCurrent=null;if(G.phase==='roundover'||G.over)v49BuyQueue=[];v49ShowNextBuyReceipt();};v49BuyTimer=setTimeout(finish,V49_NOTICE_TIMING.buyMS+2);
}
function v49PaintLootPulse(){const dock=document.querySelector('.loot-pocket');dock?.classList.toggle('loot-award-pulse',Date.now()<v49LootPulseUntil);}
function v49ClearLootEarned(){const f=v49LootFX;if(f){clearTimeout(f.timer);clearTimeout(f.flyTimer);clearTimeout(f.flyEnd);f.animation?.cancel();f.flight?.remove();f.el.remove();}v49LootFX=null;v49LootPulseUntil=0;v49PaintLootPulse();}
function v49LootChime(){if(!tabletopAudioContext||tabletopMuted||!tabletopSfxEnabled||tabletopSfxVolume<=0||document.hidden)return;const at=tabletopAudioContext.currentTime+.01;[659.25,880,1174.66].forEach((hz,i)=>tabletopTone(hz,at+i*.09,.24,tabletopSfxGain,.2,'sine'));}
function v49ShowLootEarned(reason='Stock draw bonus'){
 v49ClearLootEarned();const root=document.createElement('aside');root.id='loot-earned-toast';root.setAttribute('role','status');root.setAttribute('aria-live','polite');root.dataset.shownAt=Date.now();root.innerHTML=`<span class="loot-earned-art" aria-hidden="true">${tabletopLootBoxSVG()}<i>✦</i><i>✧</i><i>✦</i></span><span><b>🎁 You got a loot box!</b><small>${v49Escape(reason)} · ${tabletopLoot.boxes} unopened</small><em>Tap anywhere to dismiss · game keeps going</em></span>`;document.body.appendChild(root);
 const f={state:G,el:root,timer:null,flyTimer:null,flyEnd:null,animation:null,flight:null};v49LootFX=f;v49LootPulseUntil=Date.now()+V49_NOTICE_TIMING.lootMS;v49PaintLootPulse();v49LootChime();
 f.flyTimer=setTimeout(()=>{if(v49LootFX!==f||motionReduced())return;const from=root.querySelector('.loot-earned-art')?.getBoundingClientRect(),to=document.querySelector('.loot-pocket')?.getBoundingClientRect();if(!from||!to)return;const el=document.createElement('div');el.className='loot-earned-flight';el.setAttribute('aria-hidden','true');el.innerHTML=tabletopLootBoxSVG();el.style.cssText=`left:${from.left}px;top:${from.top}px`;document.body.appendChild(el);f.flight=el;f.animation=el.animate([{transform:'translate(0,-10px) scale(1.1)',opacity:1},{transform:`translate(${(to.left-from.left)*.5}px,${Math.min(-60,to.top-from.top-30)}px) scale(1.05)`,offset:.5},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) scale(.85)`,opacity:1}],{duration:650,easing:'cubic-bezier(.2,.65,.35,1)',fill:'forwards'});f.flyEnd=setTimeout(()=>{f.animation?.cancel();el.remove();v49PaintLootPulse();},680);},850);
 f.timer=setTimeout(()=>{if(v49LootFX===f)v49ClearLootEarned();},V49_NOTICE_TIMING.lootMS+2);
}
function v49MaintainNotices(){if(v49BuyCurrent&&(v49BuyCurrent.state!==G||v49BuyCurrent.round!==G.round))v49ClearBuyReceipts();if(v49LootFX&&v49LootFX.state!==G)v49ClearLootEarned();v49PaintLootPulse();}
// Passive capture: dismisses the cosmetic toast without consuming a card/Buy tap.
document.addEventListener('pointerdown',()=>{if(v49LootFX)v49ClearLootEarned();},{capture:true,passive:true});

tabletopInstallSlam();
tabletopInstallBotStrategy();
{const base=render;render=function(...args){const r=base.apply(this,args);v49MaintainNotices();return r;};}
newGame(5);
try{if(localStorage.getItem('shanghai-howto-seen')!=='yes')tabletopOpenIntro();}catch(_){tabletopOpenIntro();}
</script>
